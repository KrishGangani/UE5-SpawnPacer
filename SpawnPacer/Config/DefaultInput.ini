; P02 SpawnPacer - input configuration.
; Only the two keys Epic's 5.8 TP_Blank template sets for Enhanced Input. Without them the engine creates the classic
; UPlayerInput, and the (default-enabled) Enhanced Input plugin warns at startup that its local-player subsystem has
; "no valid PlayerInput object" (Phase 4 smoke run, 09_Testing_And_Benchmarks.md F-4a). The project reads no input.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
